name: Aletheia Seal Desk Quality Gate

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"

permissions:
  contents: read

jobs:
  dashboard-quality:
    name: Dashboard test, type check, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and interaction tests
        run: pnpm test

      - name: Run TypeScript validation
        run: pnpm check

      - name: Build production bundle
        run: pnpm build
